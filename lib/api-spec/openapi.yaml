openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Mwedi API
  version: 0.1.0
  description: Mwedi Threads project catalog and progress tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Knitting and crochet project catalog
  - name: dashboard
    description: Project overview and recent progress
  - name: stash
    description: A maker's yarn stash and the shared yarn catalog
  - name: crafts
    description: Which crafts (yarn, sewing) a maker has turned on
  - name: sewing
    description: A maker's Sewing room and fabric stash
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in user's project overview
      responses:
        "200":
          description: Project summary and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List the signed-in user's projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - in: query
          name: craft
          schema:
            $ref: "#/components/schemas/CraftType"
        - in: query
          name: starred
          description: Only return projects the signed-in user has starred
          schema:
            type: boolean
      responses:
        "200":
          description: Matching projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Add a project to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/designer-website-title-preview:
    post:
      operationId: previewDesignerWebsiteTitle
      tags: [projects]
      summary: Preview a public designer website title and name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignerWebsiteTitlePreviewRequest"
      responses:
        "200":
          description: Website URL, concise page title, and inferred designer name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignerWebsiteTitlePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: The public website could not be reached or did not return HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its progress log
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project details or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its progress log
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/star:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: starProject
      tags: [projects]
      summary: Star a project
      responses:
        "204":
          description: Project starred
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unstarProject
      tags: [projects]
      summary: Remove the star from a project
      responses:
        "204":
          description: Star removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/counter:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setProjectCounter
      tags: [projects]
      summary: Save the project's counter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCounter"
      responses:
        "200":
          description: Counter saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCounter"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addProgress
      tags: [projects]
      summary: Record a project progress update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgress"
      responses:
        "201":
          description: Progress entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress-photo-upload:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestProgressPhotoUpload
      tags: [projects]
      summary: Request a private upload URL for a project progress photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress/{entryId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProgress
      tags: [projects]
      summary: Edit a project progress entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProgress"
      responses:
        "200":
          description: Progress entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProgress
      tags: [projects]
      summary: Delete a project progress entry
      responses:
        "204":
          description: Progress entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress/{entryId}/photo:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProgressPhoto
      tags: [projects]
      summary: View an image attached to a project progress entry
      responses:
        "302":
          description: Redirects to a short-lived private image URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProgressPhoto
      tags: [projects]
      summary: Remove the image attached to a project progress entry
      responses:
        "204":
          description: Progress photo removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash:
    get:
      operationId: getStashYarns
      tags: [stash]
      summary: List the yarn in the signed-in user's stash
      parameters:
        - in: query
          name: search
          description: Matches brand, sub brand, color or fiber
          schema:
            type: string
        - in: query
          name: weight
          schema:
            $ref: "#/components/schemas/YarnWeight"
        - in: query
          name: generalColor
          schema:
            $ref: "#/components/schemas/GeneralColor"
      responses:
        "200":
          description: Matching stash yarn
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StashYarn"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStashYarn
      tags: [stash]
      summary: Add a yarn to the stash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStashYarn"
      responses:
        "201":
          description: Yarn added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /yarn-stash/skein-suggestions:
    get:
      operationId: getSkeinSuggestions
      tags: [stash]
      summary: Skeins-left suggestions waiting for the maker to confirm
      parameters:
        - in: query
          name: projectId
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pending suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkeinSuggestion"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /yarn-stash/skein-suggestions/{suggestionId}/accept:
    parameters:
      - in: path
        name: suggestionId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: acceptSkeinSuggestion
      tags: [stash]
      summary: Take the project's skeins off what's left of the stash yarn
      responses:
        "200":
          description: Stash yarn updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash/skein-suggestions/{suggestionId}/dismiss:
    parameters:
      - in: path
        name: suggestionId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: dismissSkeinSuggestion
      tags: [stash]
      summary: Leave the stash yarn's skeins as they are
      responses:
        "204":
          description: Suggestion dismissed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash/photo-upload:
    post:
      operationId: requestStashPhotoUpload
      tags: [stash]
      summary: Request a private upload URL for a stash yarn photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /yarn-stash/{yarnId}:
    parameters:
      - in: path
        name: yarnId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStashYarn
      tags: [stash]
      summary: Get one yarn from the stash
      responses:
        "200":
          description: Stash yarn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStashYarn
      tags: [stash]
      summary: Change a yarn in the stash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStashYarn"
      responses:
        "200":
          description: Yarn updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStashYarn
      tags: [stash]
      summary: Remove a yarn from the stash
      responses:
        "204":
          description: Yarn removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash/{yarnId}/photo:
    parameters:
      - in: path
        name: yarnId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStashYarnPhoto
      tags: [stash]
      summary: View a stash yarn's photo
      responses:
        "302":
          description: Redirects to a short-lived private image URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash/{yarnId}/reviews:
    parameters:
      - in: path
        name: yarnId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStashYarnReviews
      tags: [stash]
      summary: Name reviews the maker asked for on this yarn
      responses:
        "200":
          description: Reviews, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog-reviews:
    get:
      operationId: getCatalogReviews
      tags: [stash]
      summary: Name reviews for the catalog reviewer, open ones first
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogReview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the catalog reviewer can see reviews
    post:
      operationId: createCatalogReview
      tags: [stash]
      summary: Ask for a review of how a yarn name was merged in the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogReview"
      responses:
        "201":
          description: Review requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /catalog-reviews/access:
    get:
      operationId: getCatalogReviewAccess
      tags: [stash]
      summary: Whether the signed-in user reviews catalog names
      responses:
        "200":
          description: Access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReviewAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /catalog-reviews/{reviewId}/resolve:
    parameters:
      - in: path
        name: reviewId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveCatalogReview
      tags: [stash]
      summary: Rename the catalog entry or keep it as it is
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCatalogReview"
      responses:
        "200":
          description: Review resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the catalog reviewer can resolve reviews
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-catalog:
    get:
      operationId: getYarnCatalog
      tags: [stash]
      summary: Look up the shared yarn catalog while filling in a stash yarn
      description: >-
        Returns brands that match what was typed, the brand's sub brands, the
        sub brand's colors and the known fibers, plus a "Did you mean" name
        for any field that looks like a typo of an existing catalog name.
      parameters:
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: subBrand
          schema:
            type: string
        - in: query
          name: color
          schema:
            type: string
      responses:
        "200":
          description: Catalog matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YarnCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/crafts:
    get:
      operationId: getMyCrafts
      tags: [crafts]
      summary: Which crafts the signed-in maker has turned on
      responses:
        "200":
          description: The maker's crafts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crafts"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateMyCrafts
      tags: [crafts]
      summary: Turn yarn or sewing on or off (at least one stays on)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCrafts"
      responses:
        "200":
          description: Crafts saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Crafts"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fabric-stash:
    get:
      operationId: getStashFabrics
      tags: [sewing]
      summary: List the fabric in the signed-in maker's stash
      parameters:
        - in: query
          name: search
          description: Matches fabric type, brand or notes
          schema:
            type: string
        - in: query
          name: fabricType
          schema:
            $ref: "#/components/schemas/FabricType"
        - in: query
          name: print
          schema:
            $ref: "#/components/schemas/FabricPrint"
        - in: query
          name: generalColor
          schema:
            $ref: "#/components/schemas/GeneralColor"
      responses:
        "200":
          description: Matching stash fabric
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StashFabric"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStashFabric
      tags: [sewing]
      summary: Add a fabric to the stash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStashFabric"
      responses:
        "201":
          description: Fabric added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashFabric"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fabric-stash/photo-upload:
    post:
      operationId: requestFabricPhotoUpload
      tags: [sewing]
      summary: Request a private upload URL for a fabric photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fabric-stash/{fabricId}:
    parameters:
      - in: path
        name: fabricId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStashFabric
      tags: [sewing]
      summary: Get one fabric from the stash
      responses:
        "200":
          description: Stash fabric
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashFabric"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStashFabric
      tags: [sewing]
      summary: Change a fabric in the stash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStashFabric"
      responses:
        "200":
          description: Fabric updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashFabric"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStashFabric
      tags: [sewing]
      summary: Remove a fabric from the stash
      responses:
        "204":
          description: Fabric removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /fabric-stash/{fabricId}/photos/{photoIndex}:
    parameters:
      - in: path
        name: fabricId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: photoIndex
        required: true
        description: 0 is the print close-up, 1 to 3 are the extra photos
        schema:
          type: integer
          minimum: 0
          maximum: 3
    get:
      operationId: getStashFabricPhoto
      tags: [sewing]
      summary: View one of a fabric's photos
      responses:
        "302":
          description: Redirects to a short-lived private image URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sewing-projects:
    get:
      operationId: getSewingProjects
      tags: [sewing]
      summary: List the signed-in maker's sewing projects
      parameters:
        - in: query
          name: search
          description: Matches title, pattern, designer or size made
          schema:
            type: string
        - in: query
          name: status
          schema:
