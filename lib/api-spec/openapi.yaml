openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Mwedi API
  version: 0.1.0
  description: Mwedi Threads project catalog and progress tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Knitting and crochet project catalog
  - name: dashboard
    description: Project overview and recent progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in user's project overview
      responses:
        "200":
          description: Project summary and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List the signed-in user's projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - in: query
          name: craft
          schema:
            $ref: "#/components/schemas/CraftType"
      responses:
        "200":
          description: Matching projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Add a project to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/designer-website-title-preview:
    post:
      operationId: previewDesignerWebsiteTitle
      tags: [projects]
      summary: Preview the page title for a public designer website
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignerWebsiteTitlePreviewRequest"
      responses:
        "200":
          description: Website URL and extracted page title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignerWebsiteTitlePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: The public website could not be reached or did not return HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its progress log
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project details or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its progress log
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addProgress
      tags: [projects]
      summary: Record a project progress update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgress"
      responses:
        "201":
          description: Progress entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress-photo-upload:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestProgressPhotoUpload
      tags: [projects]
      summary: Request a private upload URL for a project progress photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress/{entryId}/photo:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProgressPhoto
      tags: [projects]
      summary: View an image attached to a project progress entry
      responses:
        "302":
          description: Redirects to a short-lived private image URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProgressPhoto
      tags: [projects]
      summary: Remove the image attached to a project progress entry
      responses:
        "204":
          description: Progress photo removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  responses:
    Unauthorized:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested project was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CraftType:
      type: string
      enum: [knitting, crochet]
    ProjectStatus:
      type: string
      enum: [planning, in_progress, paused, completed]
    ProjectDatePrecision:
      type: string
      enum: [month, day]
    ProgressEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        notes:
          type: string
        photoPath:
          type: [string, "null"]
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, notes, photoPath, completionPercent, createdAt]
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarnBrand:
          type: [string, "null"]
        yarnType:
          type: [string, "null"]
        yarnColor:
          type: [string, "null"]
        tools:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date
        startedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        targetDate:
          type: [string, "null"]
          format: date
        targetDatePrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - craft
        - status
        - description
        - patternName
        - patternDesigner
        - designerWebsite
        - designerPageTitle
        - yarn
        - yarnBrand
        - yarnType
        - yarnColor
        - tools
        - startedAt
        - startedAtPrecision
        - targetDate
        - targetDatePrecision
        - completionPercent
        - createdAt
        - updatedAt
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            progress:
              type: array
              items:
                $ref: "#/components/schemas/ProgressEntry"
          required: [progress]
    CreateProject:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarnBrand:
          type: [string, "null"]
        yarnType:
          type: [string, "null"]
        yarnColor:
          type: [string, "null"]
        tools:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date
        startedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        targetDate:
          type: [string, "null"]
          format: date
        targetDatePrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
      required: [title, craft]
    UpdateProject:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarnBrand:
          type: [string, "null"]
        yarnType:
          type: [string, "null"]
        yarnColor:
          type: [string, "null"]
        tools:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date
        startedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        targetDate:
          type: [string, "null"]
          format: date
        targetDatePrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
      minProperties: 1
    DesignerWebsiteTitlePreviewRequest:
      type: object
      properties:
        websiteUrl:
          type: string
          format: uri
      required: [websiteUrl]
    DesignerWebsiteTitlePreviewResponse:
      type: object
      properties:
        websiteUrl:
          type: string
          format: uri
        pageTitle:
          type: [string, "null"]
      required: [websiteUrl, pageTitle]
    CreateProgress:
      type: object
      properties:
        notes:
          type: string
          minLength: 1
          maxLength: 2000
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        photoPath:
          type: string
          minLength: 1
      required: [notes, completionPercent]
    ProgressPhotoUploadRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [name, size, contentType]
    ProgressPhotoUploadResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        photoPath:
          type: string
      required: [uploadURL, photoPath]
    Dashboard:
      type: object
      properties:
        totalProjects:
          type: integer
        activeProjects:
          type: integer
        completedProjects:
          type: integer
        recentProjects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        recentProgress:
          type: array
          items:
            type: object
            properties:
              projectTitle:
                type: string
              projectId:
                type: string
                format: uuid
              notes:
                type: string
              completionPercent:
                type: integer
              createdAt:
                type: string
                format: date-time
            required: [projectTitle, projectId, notes, completionPercent, createdAt]
      required:
        - totalProjects
        - activeProjects
        - completedProjects
        - recentProjects
        - recentProgress

