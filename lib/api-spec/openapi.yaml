          type: string
          description: Inferred from site metadata or the public website hostname
      required: [websiteUrl, pageTitle, designerName]
    CreateProgress:
      type: object
      properties:
        notes:
          type: string
          minLength: 1
          maxLength: 2000
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
          description: Required when the project uses the estimate method; worked out by the server otherwise.
        progressValue:
          type: number
          minimum: 0
          maximum: 100000
          description: Row or round reached, or skeins used so far.
        sectionsDone:
          type: array
          maxItems: 40
