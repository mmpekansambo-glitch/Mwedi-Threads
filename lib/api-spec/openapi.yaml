openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Mwedi API
  version: 0.1.0
  description: Mwedi Threads project catalog and progress tracking API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Knitting and crochet project catalog
  - name: dashboard
    description: Project overview and recent progress
  - name: stash
    description: A maker's yarn stash and the shared yarn catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the signed-in user's project overview
      responses:
        "200":
          description: Project summary and recent activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List the signed-in user's projects
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/ProjectStatus"
        - in: query
          name: craft
          schema:
            $ref: "#/components/schemas/CraftType"
        - in: query
          name: starred
          description: Only return projects the signed-in user has starred
          schema:
            type: boolean
      responses:
        "200":
          description: Matching projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Add a project to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProject"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /projects/designer-website-title-preview:
    post:
      operationId: previewDesignerWebsiteTitle
      tags: [projects]
      summary: Preview a public designer website title and name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesignerWebsiteTitlePreviewRequest"
      responses:
        "200":
          description: Website URL, concise page title, and inferred designer name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesignerWebsiteTitlePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: The public website could not be reached or did not return HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project and its progress log
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update project details or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProject"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its progress log
      responses:
        "204":
          description: Project deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/star:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: starProject
      tags: [projects]
      summary: Star a project
      responses:
        "204":
          description: Project starred
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: unstarProject
      tags: [projects]
      summary: Remove the star from a project
      responses:
        "204":
          description: Star removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: addProgress
      tags: [projects]
      summary: Record a project progress update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProgress"
      responses:
        "201":
          description: Progress entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress-photo-upload:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: requestProgressPhotoUpload
      tags: [projects]
      summary: Request a private upload URL for a project progress photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/progress/{entryId}/photo:
    parameters:
      - in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: entryId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProgressPhoto
      tags: [projects]
      summary: View an image attached to a project progress entry
      responses:
        "302":
          description: Redirects to a short-lived private image URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProgressPhoto
      tags: [projects]
      summary: Remove the image attached to a project progress entry
      responses:
        "204":
          description: Progress photo removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash:
    get:
      operationId: getStashYarns
      tags: [stash]
      summary: List the yarn in the signed-in user's stash
      parameters:
        - in: query
          name: search
          description: Matches brand, sub brand, color or fiber
          schema:
            type: string
        - in: query
          name: weight
          schema:
            $ref: "#/components/schemas/YarnWeight"
        - in: query
          name: generalColor
          schema:
            $ref: "#/components/schemas/GeneralColor"
      responses:
        "200":
          description: Matching stash yarn
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StashYarn"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStashYarn
      tags: [stash]
      summary: Add a yarn to the stash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStashYarn"
      responses:
        "201":
          description: Yarn added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /yarn-stash/photo-upload:
    post:
      operationId: requestStashPhotoUpload
      tags: [stash]
      summary: Request a private upload URL for a stash yarn photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressPhotoUploadRequest"
      responses:
        "200":
          description: Private upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressPhotoUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /yarn-stash/{yarnId}:
    parameters:
      - in: path
        name: yarnId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStashYarn
      tags: [stash]
      summary: Get one yarn from the stash
      responses:
        "200":
          description: Stash yarn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStashYarn
      tags: [stash]
      summary: Change a yarn in the stash
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStashYarn"
      responses:
        "200":
          description: Yarn updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StashYarn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStashYarn
      tags: [stash]
      summary: Remove a yarn from the stash
      responses:
        "204":
          description: Yarn removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-stash/{yarnId}/photo:
    parameters:
      - in: path
        name: yarnId
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getStashYarnPhoto
      tags: [stash]
      summary: View a stash yarn's photo
      responses:
        "302":
          description: Redirects to a short-lived private image URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /yarn-catalog:
    get:
      operationId: getYarnCatalog
      tags: [stash]
      summary: Look up the shared yarn catalog while filling in a stash yarn
      description: >-
        Returns brands that match what was typed, the brand's sub brands, the
        sub brand's colors and the known fibers, plus a "Did you mean" name
        for any field that looks like a typo of an existing catalog name.
      parameters:
        - in: query
          name: brand
          schema:
            type: string
        - in: query
          name: subBrand
          schema:
            type: string
        - in: query
          name: color
          schema:
            type: string
      responses:
        "200":
          description: Catalog matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YarnCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  responses:
    Unauthorized:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested project was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CraftType:
      type: string
      enum: [knitting, crochet]
    ProjectStatus:
      type: string
      enum: [planning, in_progress, paused, completed]
    ProjectDatePrecision:
      type: string
      enum: [month, day]
    ProgressMethod:
      type: string
      enum: [estimate, rows, sections, skeins]
      description: How a project's completion percentage is worked out.
    ProgressSection:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        done:
          type: boolean
      required: [name, done]
    ProgressEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        notes:
          type: string
        photoPath:
          type: [string, "null"]
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        progressValue:
          type: [number, "null"]
          description: The row or round reached, or skeins used, when the project tracks those.
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, notes, photoPath, completionPercent, progressValue, createdAt]
    CrochetHookSize:
      type: string
      enum:
        - "2.25 mm (US B-1, UK/Canada 13)"
        - "2.75 mm (US C-2, UK/Canada 12)"
        - "3.25 mm (US D-3, UK/Canada 10)"
        - "3.5 mm (US E-4, UK/Canada 9)"
        - "3.75 mm (US F-5, UK/Canada —)"
        - "4.0 mm (US G-6, UK/Canada 8)"
        - "4.5 mm (US 7, UK/Canada 7)"
        - "5.0 mm (US H-8, UK/Canada 6)"
        - "5.5 mm (US I-9, UK/Canada 5)"
        - "6.0 mm (US J-10, UK/Canada 4)"
        - "6.5 mm (US K-10½, UK/Canada 3)"
        - "7.0 mm (US —, UK/Canada 2)"
        - "8.0 mm (US L-11, UK/Canada 0)"
        - "9.0 mm (US M/N-13, UK/Canada 00)"
        - "10.0 mm (US N/P-15, UK/Canada 000)"
        - "11.5 mm (US P-16, UK/Canada —)"
        - "15 mm (US P/Q, UK/Canada —)"
        - "16 mm (US Q, UK/Canada —)"
        - "19 mm (US S, UK/Canada —)"
        - "25 mm (US T/U/X, UK/Canada —)"
    KnittingNeedleSize:
      type: string
      enum:
        - "2.0 mm (US 0, UK/Canada 14)"
        - "2.25 mm (US 1, UK/Canada 13)"
        - "2.5 mm (US 1.5, UK/Canada —)"
        - "2.75 mm (US 2, UK/Canada 12)"
        - "3.0 mm (US 2.5, UK/Canada 11)"
        - "3.25 mm (US 3, UK/Canada 10)"
        - "3.5 mm (US 4, UK/Canada —)"
        - "3.75 mm (US 5, UK/Canada 9)"
        - "4.0 mm (US 6, UK/Canada 8)"
        - "4.5 mm (US 7, UK/Canada 7)"
        - "5.0 mm (US 8, UK/Canada 6)"
        - "5.5 mm (US 9, UK/Canada 5)"
        - "6.0 mm (US 10, UK/Canada 4)"
        - "6.5 mm (US 10.5, UK/Canada 3)"
        - "7.0 mm (US —, UK/Canada 2)"
        - "7.5 mm (US —, UK/Canada 1)"
        - "8.0 mm (US 11, UK/Canada 0)"
        - "9.0 mm (US 13, UK/Canada 00)"
        - "10.0 mm (US 15, UK/Canada 000)"
        - "12–12.75 mm (US 17, UK/Canada —)"
        - "15–16 mm (US 19, UK/Canada —)"
        - "19 mm (US 35, UK/Canada —)"
        - "20 mm (US 36, UK/Canada —)"
        - "25 mm (US 50, UK/Canada —)"
    KnittingNeedleType:
      type: string
      enum: [straight, circular, double_pointed, interchangeable]
    NeedleCableLength:
      type: string
      description: Cable length for circular and interchangeable needles.
      enum:
        - "23 cm (9 in)"
        - "30 cm (12 in)"
        - "40 cm (16 in)"
        - "60 cm (24 in)"
        - "80 cm (32 in)"
        - "100 cm (40 in)"
        - "120 cm (47 in)"
        - "150 cm (60 in)"
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://"
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarnBrand:
          type: [string, "null"]
        yarnType:
          type: [string, "null"]
        yarnColor:
          type: [string, "null"]
        tools:
          type: [string, "null"]
        hookSize:
          anyOf:
            - $ref: "#/components/schemas/CrochetHookSize"
            - type: "null"
        needleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        needleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
            - type: "null"
        needleCableLength:
          anyOf:
            - $ref: "#/components/schemas/NeedleCableLength"
            - type: "null"
        secondNeedleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        secondNeedleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
            - type: "null"
        secondNeedleCableLength:
          anyOf:
            - $ref: "#/components/schemas/NeedleCableLength"
            - type: "null"
        startedAt:
          type: [string, "null"]
          format: date
        startedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        targetDate:
          type: [string, "null"]
          format: date
        targetDatePrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        completedAt:
          type: [string, "null"]
          format: date
        completedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        starred:
          type: boolean
        progressMethod:
          $ref: "#/components/schemas/ProgressMethod"
        progressTotal:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
          description: Total rows or rounds, or skeins planned.
        progressSections:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/ProgressSection"
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - craft
        - status
        - description
        - patternName
        - patternDesigner
        - designerWebsite
        - designerPageTitle
        - yarn
        - yarnBrand
        - yarnType
        - yarnColor
        - tools
        - hookSize
        - needleSize
        - needleType
        - needleCableLength
        - secondNeedleSize
        - secondNeedleType
        - secondNeedleCableLength
        - startedAt
        - startedAtPrecision
        - targetDate
        - targetDatePrecision
        - completedAt
        - completedAtPrecision
        - starred
        - progressMethod
        - progressTotal
        - progressSections
        - completionPercent
        - createdAt
        - updatedAt
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            progress:
              type: array
              items:
                $ref: "#/components/schemas/ProgressEntry"
          required: [progress]
    CreateProject:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://"
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarnBrand:
          type: [string, "null"]
        yarnType:
          type: [string, "null"]
        yarnColor:
          type: [string, "null"]
        tools:
          type: [string, "null"]
        hookSize:
          anyOf:
            - $ref: "#/components/schemas/CrochetHookSize"
            - type: "null"
        needleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        needleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
            - type: "null"
        needleCableLength:
          anyOf:
            - $ref: "#/components/schemas/NeedleCableLength"
            - type: "null"
        secondNeedleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        secondNeedleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
            - type: "null"
        secondNeedleCableLength:
          anyOf:
            - $ref: "#/components/schemas/NeedleCableLength"
            - type: "null"
        startedAt:
          type: [string, "null"]
          format: date
        startedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        targetDate:
          type: [string, "null"]
          format: date
        targetDatePrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        progressMethod:
          $ref: "#/components/schemas/ProgressMethod"
        progressTotal:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
          description: Total rows or rounds, or skeins planned.
        progressSections:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/ProgressSection"
      required: [title, craft]
    UpdateProject:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://"
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarnBrand:
          type: [string, "null"]
        yarnType:
          type: [string, "null"]
        yarnColor:
          type: [string, "null"]
        tools:
          type: [string, "null"]
        hookSize:
          anyOf:
            - $ref: "#/components/schemas/CrochetHookSize"
            - type: "null"
        needleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        needleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
