components:
  responses:
    Unauthorized:
      description: Sign in is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested project was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    CraftType:
      type: string
      enum: [knitting, crochet]
    ProjectStatus:
      type: string
      enum: [planning, in_progress, paused, completed]
    ProjectDatePrecision:
      type: string
      enum: [month, day]
    ProgressMethod:
      type: string
      enum: [estimate, rows, sections, skeins]
      description: How a project's completion percentage is worked out.
    ProgressSection:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        done:
          type: boolean
      required: [name, done]
    ProgressEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        notes:
          type: string
        photoPath:
          type: [string, "null"]
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        progressValue:
          type: [number, "null"]
          description: The row or round reached, or skeins used, when the project tracks those.
        createdAt:
          type: string
          format: date-time
      required: [id, projectId, notes, photoPath, completionPercent, progressValue, createdAt]
    CrochetHookSize:
      type: string
      enum:
        - "2.25 mm (US B-1, UK/Canada 13)"
        - "2.75 mm (US C-2, UK/Canada 12)"
        - "3.25 mm (US D-3, UK/Canada 10)"
        - "3.5 mm (US E-4, UK/Canada 9)"
        - "3.75 mm (US F-5, UK/Canada —)"
        - "4.0 mm (US G-6, UK/Canada 8)"
        - "4.5 mm (US 7, UK/Canada 7)"
        - "5.0 mm (US H-8, UK/Canada 6)"
        - "5.5 mm (US I-9, UK/Canada 5)"
        - "6.0 mm (US J-10, UK/Canada 4)"
        - "6.5 mm (US K-10½, UK/Canada 3)"
        - "7.0 mm (US —, UK/Canada 2)"
        - "8.0 mm (US L-11, UK/Canada 0)"
        - "9.0 mm (US M/N-13, UK/Canada 00)"
        - "10.0 mm (US N/P-15, UK/Canada 000)"
        - "11.5 mm (US P-16, UK/Canada —)"
        - "15 mm (US P/Q, UK/Canada —)"
        - "16 mm (US Q, UK/Canada —)"
        - "19 mm (US S, UK/Canada —)"
        - "25 mm (US T/U/X, UK/Canada —)"
    KnittingNeedleSize:
      type: string
      enum:
        - "2.0 mm (US 0, UK/Canada 14)"
        - "2.25 mm (US 1, UK/Canada 13)"
        - "2.5 mm (US 1.5, UK/Canada —)"
        - "2.75 mm (US 2, UK/Canada 12)"
        - "3.0 mm (US 2.5, UK/Canada 11)"
        - "3.25 mm (US 3, UK/Canada 10)"
        - "3.5 mm (US 4, UK/Canada —)"
        - "3.75 mm (US 5, UK/Canada 9)"
        - "4.0 mm (US 6, UK/Canada 8)"
        - "4.5 mm (US 7, UK/Canada 7)"
        - "5.0 mm (US 8, UK/Canada 6)"
        - "5.5 mm (US 9, UK/Canada 5)"
        - "6.0 mm (US 10, UK/Canada 4)"
        - "6.5 mm (US 10.5, UK/Canada 3)"
        - "7.0 mm (US —, UK/Canada 2)"
        - "7.5 mm (US —, UK/Canada 1)"
        - "8.0 mm (US 11, UK/Canada 0)"
        - "9.0 mm (US 13, UK/Canada 00)"
        - "10.0 mm (US 15, UK/Canada 000)"
        - "12–12.75 mm (US 17, UK/Canada —)"
        - "15–16 mm (US 19, UK/Canada —)"
        - "19 mm (US 35, UK/Canada —)"
        - "20 mm (US 36, UK/Canada —)"
        - "25 mm (US 50, UK/Canada —)"
    KnittingNeedleType:
      type: string
      enum: [straight, circular, double_pointed, interchangeable]
    NeedleCableLength:
      type: string
      description: Cable length for circular and interchangeable needles.
      enum:
        - "23 cm (9 in)"
        - "30 cm (12 in)"
        - "40 cm (16 in)"
        - "60 cm (24 in)"
        - "80 cm (32 in)"
        - "100 cm (40 in)"
        - "120 cm (47 in)"
        - "150 cm (60 in)"
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        craft:
          $ref: "#/components/schemas/CraftType"
        status:
          $ref: "#/components/schemas/ProjectStatus"
        description:
          type: [string, "null"]
        patternName:
          type: [string, "null"]
        patternDesigner:
          type: [string, "null"]
        designerWebsite:
          type: [string, "null"]
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]?://"
        designerPageTitle:
          type: [string, "null"]
        yarn:
          type: [string, "null"]
        yarns:
          type: array
          items:
            $ref: "#/components/schemas/ProjectYarn"
        tools:
          type: [string, "null"]
        hookSize:
          anyOf:
            - $ref: "#/components/schemas/CrochetHookSize"
            - type: "null"
        secondHookSize:
          anyOf:
            - $ref: "#/components/schemas/CrochetHookSize"
            - type: "null"
        needleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        needleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
            - type: "null"
        needleCableLength:
          anyOf:
            - $ref: "#/components/schemas/NeedleCableLength"
            - type: "null"
        secondNeedleSize:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleSize"
            - type: "null"
        secondNeedleType:
          anyOf:
            - $ref: "#/components/schemas/KnittingNeedleType"
            - type: "null"
        secondNeedleCableLength:
          anyOf:
            - $ref: "#/components/schemas/NeedleCableLength"
            - type: "null"
        startedAt:
          type: [string, "null"]
          format: date
        startedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        targetDate:
          type: [string, "null"]
          format: date
        targetDatePrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        completedAt:
          type: [string, "null"]
          format: date
        completedAtPrecision:
          $ref: "#/components/schemas/ProjectDatePrecision"
        starred:
          type: boolean
        progressMethod:
          $ref: "#/components/schemas/ProgressMethod"
        progressTotal:
          type: [number, "null"]
          exclusiveMinimum: 0
          maximum: 100000
          description: Total rows or rounds, or skeins planned.
        progressSections:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/ProgressSection"
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        counter:
          type: integer
          minimum: 0
          description: The project's plain counter (any count the maker likes).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - counter
        - craft
        - status
        - description
        - patternName
        - patternDesigner
        - designerWebsite
        - designerPageTitle
        - yarn
        - yarns
        - tools
        - hookSize
        - secondHookSize
        - needleSize
        - needleType
        - needleCableLength
        - secondNeedleSize
        - secondNeedleType
        - secondNeedleCableLength
        - startedAt
        - startedAtPrecision
        - targetDate
        - targetDatePrecision
        - completedAt
        - completedAtPrecision
        - starred
        - progressMethod
        - progressTotal
        - progressSections
        - completionPercent
        - createdAt
        - updatedAt
