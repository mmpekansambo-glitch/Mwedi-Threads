kind = "web"
previewPath = "/"
title = "IndigoLoom"
description = "A companion web app for knitters and crocheters to catalog their projects, organize pattern and materials details, and record progress from the first stitch through completion. Includes secure sign-in and a mobile companion that shares the same account and project data."
version = "1.0.0"
id = "artifacts/indigoloom-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21586

[services.development]
run = "pnpm --filter @workspace/indigoloom-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/indigoloom-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/indigoloom-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21586"
BASE_PATH = "/"
