kind = "mobile"
previewPath = "/mobile/"
title = "Mwedi Mobile"
description = "The native mobile companion for Mwedi, helping knitters and crocheters keep their project catalog, materials notes, and progress log close at hand. It shares accounts and saved project data with the Mwedi web app."
version = "1.0.0"
id = "artifacts/indigoloom-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 23317

[services.development]
run = "pnpm --filter @workspace/indigoloom-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/indigoloom-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/indigoloom-mobile", "run", "serve" ]

[services.env]
PORT = "23317"
BASE_PATH = "/mobile/"
